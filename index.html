<script>
(()=>{'use strict';
const form=document.getElementById('unlock-form'),input=document.getElementById('access-code'),button=document.getElementById('unlock-button'),status=document.getElementById('unlock-status');
const payload=JSON.parse(document.getElementById('encrypted-payload').textContent);
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
try{const probe='fitness20-storage-check';localStorage.setItem(probe,'1');localStorage.removeItem(probe);}catch(e){document.getElementById('storage-availability').textContent='当前浏览器未允许本地保存。解锁后请在关闭前导出备份；换用普通浏览器并允许网站存储。';}
if(!window.crypto?.subtle){status.textContent='当前环境不支持解锁。请通过 HTTPS 正式网址，用更新后的浏览器打开。';button.disabled=true;}
form.addEventListener('submit',async e=>{e.preventDefault();if(button.disabled)return;let code=input.value;if(!/^\d{4}$/.test(code)){status.textContent='请输入完整的四位数字。';input.focus();return;}button.disabled=true;button.textContent='正在解锁…';status.textContent='正在验证，请稍候。';
try{const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);code='';input.value='';const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const buffer=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.ciphertext));const html=new TextDecoder('utf-8',{fatal:true}).decode(buffer);document.open();document.write(html);document.close();}
catch(error){code='';input.value='';status.textContent='解锁码不正确，请重新输入。若确认无误，请重新下载或刷新页面。';button.disabled=false;button.textContent='解锁手册 →';input.focus();}
});})();
</script></body></html>
